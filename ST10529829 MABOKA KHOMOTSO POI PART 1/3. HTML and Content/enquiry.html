<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Crust Bakery | Enquiry</title>
</head>
<body bgcolor="#FFF8EE">

<header>
    <center>
        <h1>🍞 Urban Crust Bakery</h1>
        <p><strong>Product Enquiry</strong></p>
    </center>
    <nav>
        <center>
            <a href="index.html">Home</a> |
            <a href="about.html">About Us</a> |
            <a href="products.html">Products</a> |
            <a href="enquiry.html">Enquiry</a> |
            <a href="contact.html">Contact</a>
        </center>
    </nav>
</header>

<hr>

<main>
    <center>
        <h2>Make a Product Enquiry</h2>
        <p>Complete the form below and we will respond to your enquiry.</p>
    </center>

    <form action="mailto:info@urbancrustbakery.co.za" method="post" enctype="text/plain">
        <fieldset>
            <legend><strong>Customer Information</strong></legend>

            <p>
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="Full Name" required>
            </p>

            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="Email" required>
            </p>

            <p>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="Phone Number" required>
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend><strong>Product Details</strong></legend>

            <p>
                <label for="product">Select Product:</label><br>
                <select id="product" name="Product" required>
                    <option value="">-- Select a product --</option>
                    <option value="Chocolate Celebration Cake">Chocolate Celebration Cake</option>
                    <option value="Vanilla Cupcakes">Vanilla Cupcakes</option>
                    <option value="Fresh Bread">Fresh Bread</option>
                    <option value="Apple Pastry">Apple Pastry</option>
                    <option value="Custom Cake">Custom Cake</option>
                </select>
            </p>

            <p>
                <label for="quantity">Quantity:</label><br>
                <input type="number" id="quantity" name="Quantity" min="1" required>
            </p>

            <p>
                <label for="date">Preferred Collection Date:</label><br>
                <input type="date" id="date" name="Collection Date">
            </p>

            <p>
                <label for="custom">Custom Cake Requirements:</label><br>
                <textarea id="custom" name="Custom Cake Requirements" rows="6" cols="50"
                    placeholder="Describe your preferred size, flavour, message or design."></textarea>
            </p>
        </fieldset>

        <br>

        <center>
            <input type="submit" value="Submit Enquiry">
            <input type="reset" value="Clear Form">
        </center>
    </form>
</main>

<hr>

<footer>
    <center>
        <p><strong>Urban Crust Bakery</strong></p>
        <p>&copy; 2026 Urban Crust Bakery. All rights reserved.</p>
    </center>
</footer>

</body>
</html>
